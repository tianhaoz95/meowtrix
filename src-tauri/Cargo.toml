[package]
name = "meowtrix"
version = "1.19.0"
description = "Meowtrix Desktop — browser-based remote workspace"
authors = ["Tianhao Zhou"]
license = "MIT"
repository = "https://github.com/tianhaoz95/meowtrix"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "meowtrix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
