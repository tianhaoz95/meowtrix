[package]
name = "meowtrix"
version = "1.26.9"
description = "Meowtrix Desktop — browser-based remote workspace"
authors = ["Tianhao Zhou"]
license = "MIT"
repository = "https://github.com/tianhaoz95/meowtrix"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "meowtrix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
mistralrs = { version = "0.8.1", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "net"] }
anyhow = "1.0"
tauri-plugin-global-shortcut = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSApplication", "NSScreen"] }
