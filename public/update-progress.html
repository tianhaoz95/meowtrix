<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meowtrix Update</title>
  <!-- Desktop-app update progress card (src-tauri/src/update_hud.rs). Rendered in a
       transparent, frameless window; the card itself draws the rounded corners and shadow. -->
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0f1a;
      --bg4: #171e31;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --text2: #94a3b8;
      --text3: #64748b;
      --accent: #6366f1;
      --accent-hi: #818cf8;
      --ok: #34d399;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: transparent;
      overflow: hidden;
      height: 100%;
      font-family: 'Inter', -apple-system, 'Segoe UI', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-user-select: none;
      user-select: none;
      cursor: default;
    }
    .card {
      position: absolute;
      top: 12px; left: 12px; right: 12px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 13px 14px 12px;
      background: linear-gradient(180deg, rgba(23, 30, 49, 0.97), rgba(11, 15, 26, 0.97));
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.45), 0 0 0 0.5px rgba(0, 0, 0, 0.6);
      animation: card-in 320ms cubic-bezier(0.2, 0.9, 0.3, 1.15) both;
    }
    @keyframes card-in {
      from { opacity: 0; transform: translateX(24px) scale(0.98); }
      to   { opacity: 1; transform: none; }
    }

    /* App logo with a soft pulsing halo while work is in progress */
    .logo {
      position: relative;
      flex: 0 0 40px;
      width: 40px;
      height: 40px;
    }
    .logo svg { position: relative; width: 40px; height: 40px; display: block; border-radius: 9px; z-index: 1; }
    .logo::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 12px;
      background: var(--accent);
      opacity: 0;
      animation: halo 1.8s ease-out infinite;
    }
    @keyframes halo {
      0%   { opacity: 0.45; transform: scale(0.92); }
      100% { opacity: 0;    transform: scale(1.25); }
    }
    body[data-phase="restarting"] .logo::before { animation: none; }
    /* the logo's caret blinks like a terminal cursor */
    .logo .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0.15; } }

    .body { flex: 1; min-width: 0; }
    .head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .title { font-size: 13px; font-weight: 600; color: var(--text); letter-spacing: -0.01em; }
    .message {
      margin-top: 2px;
      font-size: 12px;
      line-height: 1.35;
      color: var(--text2);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .close {
      flex: 0 0 auto;
      width: 18px; height: 18px;
      margin: -3px -4px 0 0;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--text3);
      font-size: 14px;
      line-height: 18px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 120ms, background 120ms, color 120ms;
    }
    .card:hover .close { opacity: 1; }
    .close:hover { background: var(--bg4); color: var(--text); }

    .bar {
      position: relative;
      height: 5px;
      margin-top: 10px;
      border-radius: 999px;
      background: var(--bg4);
      overflow: hidden;
    }
    .fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--accent-hi));
      transition: width 180ms ease-out;
      overflow: hidden;
    }
    /* moving sheen over the filled part */
    .fill::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.45), transparent);
      transform: translateX(-100%);
      animation: sheen 1.3s ease-in-out infinite;
    }
    @keyframes sheen { to { transform: translateX(100%); } }

    /* indeterminate: unknown download size, or installing */
    body.indeterminate .fill {
      width: 35% !important;
      transition: none;
      animation: slide 1.15s ease-in-out infinite;
    }
    body.indeterminate .fill::after { animation: none; }
    @keyframes slide {
      0%   { left: -35%; }
      100% { left: 100%; }
    }

    body[data-phase="restarting"] .fill {
      width: 100% !important;
      background: linear-gradient(90deg, var(--accent-hi), var(--ok));
    }

    .meta {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      font-size: 11px;
      color: var(--text3);
      font-variant-numeric: tabular-nums;
    }
    .phase-label { display: inline-flex; align-items: center; gap: 6px; }
    .spinner {
      width: 9px; height: 9px;
      border: 1.5px solid var(--text3);
      border-top-color: var(--accent-hi);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body data-phase="downloading" class="indeterminate">
  <div class="card" role="status" aria-live="polite">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <rect width="24" height="24" rx="5" fill="#090d16"/>
        <polyline points="4 8 9 12 4 16" fill="none" stroke="#6366f1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <line class="cursor" x1="12" y1="16" x2="20" y2="16" stroke="#6366f1" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M10 5l2 2 2-2" fill="none" stroke="#6366f1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="body">
      <div class="head">
        <div class="title">Meowtrix Update</div>
        <button class="close" id="close" title="Hide (the update continues)" aria-label="Hide">×</button>
      </div>
      <div class="message" id="message">Downloading Meowtrix… The app will restart automatically once completed.</div>
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div class="meta">
        <span class="phase-label"><span class="spinner"></span><span id="phase">Downloading</span></span>
        <span id="amount"></span>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      const invoke = (cmd, args) =>
        window.__TAURI_INTERNALS__ ? window.__TAURI_INTERNALS__.invoke(cmd, args || {}) : Promise.reject();
      const mb = (n) => (n / 1048576).toFixed(1);

      function render(s) {
        const v = s.version ? ' v' + s.version : '';
        const known = s.phase === 'downloading' && s.total > 0;
        const pct = known ? Math.min(100, Math.floor((s.downloaded / s.total) * 100)) : 0;
        document.body.dataset.phase = s.phase;
        document.body.classList.toggle('indeterminate', s.phase === 'installing' || (s.phase === 'downloading' && !known));
        $('fill').style.width = pct + '%';

        if (s.phase === 'downloading') {
          $('message').textContent = 'Downloading Meowtrix' + v + '… The app will restart automatically once completed.';
          $('phase').textContent = 'Downloading';
          $('amount').textContent = known
            ? mb(s.downloaded) + ' / ' + mb(s.total) + ' MB · ' + pct + '%'
            : (s.downloaded > 0 ? mb(s.downloaded) + ' MB' : '');
        } else if (s.phase === 'installing') {
          $('message').textContent = 'Installing Meowtrix' + v + '…';
          $('phase').textContent = 'Installing';
          $('amount').textContent = '';
        } else if (s.phase === 'restarting') {
          $('message').textContent = 'Meowtrix' + v + ' installed. Restarting…';
          $('phase').textContent = 'Restarting';
          $('amount').textContent = '100%';
        }
      }

      window.mtxUpdate = { render };
      $('close').addEventListener('click', () => invoke('dismiss_update_hud').catch(() => window.close()));
      // Pushes from Rust that arrive before this script runs are lost; pull the latest state.
      invoke('update_hud_state').then(render).catch(() => {});
    })();
  </script>
</body>
</html>
